<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Crumbs dev preview</title>
<style>
:root{--bg:#faf6f1;--ink:#2b2420;--muted:#8a7f76;--accent:#e2673b;--line:#eadfd3;--bad:#cf4a4a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,sans-serif}
header{display:flex;gap:12px;align-items:center;padding:12px 20px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:2}
header small,.muted{color:var(--muted);font-weight:400;margin:0}nav{display:flex;gap:6px;flex:1}#who{font-size:13px;color:var(--muted)}
main{max-width:1100px;margin:0 auto;padding:20px}h2{margin:8px 0 14px}h2 small{font-size:14px}
button,.btn{font:inherit;border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 12px;cursor:pointer}
button:hover,.btn:hover{border-color:var(--accent)}button:disabled{opacity:.3;cursor:default}
nav .on{background:var(--accent);color:#fff;border-color:var(--accent)}.link{border:0;background:none;color:var(--accent);padding:0}.danger{color:var(--bad)}
input,select,textarea{font:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:#fff;min-width:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;transition:.15s;text-align:left;padding:0}
.card:hover{transform:translateY(-3px);box-shadow:0 8px 20px #0001}.thumb{height:110px;background:linear-gradient(135deg,#f4d9c6,#e8b8a0) center/cover}
.body{padding:12px;display:flex;flex-direction:column;gap:6px}.body h3{margin:0;font-size:16px}
.add{align-items:center;justify-content:center;min-height:200px;border:2px dashed var(--line);background:transparent;color:var(--muted)}
.badge{align-self:flex-start;font-size:11px;text-transform:uppercase;padding:2px 8px;border-radius:99px;background:#eee;color:#555}
.badge.planned{background:#fde8d8;color:#b8531f}.badge.done{background:#d9f2e6;color:#1d7a50}.badge.overdue{background:#fbdcdc;color:var(--bad)}
.tags{display:flex;gap:6px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}fieldset{border:0;padding:0;margin:0;display:flex;gap:10px}
.empty{padding:40px;text-align:center;color:var(--muted);border:2px dashed var(--line);border-radius:14px}
.head{display:flex;gap:12px;align-items:center}.head h2{margin:0}.actions{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:12px 0}.actions .danger{margin-left:auto}
.row{margin:18px 0}.rowhead{display:flex;gap:8px;align-items:center}.rn{border-color:transparent;background:transparent;font-size:18px;font-weight:700;flex:1}.rn:hover,.rn:focus{border-color:var(--line);background:#fff}
.strip{display:flex;align-items:center;overflow-x:auto;padding:26px 18px 30px}
.strip::-webkit-scrollbar{height:8px}.strip::-webkit-scrollbar-thumb{background:#ccc;border-radius:9px}
.pc{flex:none;width:200px;height:300px;border-radius:22px;background:#e3e3e3 center/cover;position:relative;overflow:hidden;cursor:pointer;box-shadow:0 6px 16px #0002;transition:transform .2s;display:flex;flex-direction:column;padding:16px;font-size:14px;gap:6px}
.pc.fan{transform:rotate(var(--r));margin-left:-30px}.pc.fan:first-child{margin-left:0}.pc.fan:hover{transform:rotate(0) translateY(-10px);z-index:3}
.pc em{margin:auto;text-align:center;color:#9a9a9a}.pc p{margin:0;overflow:hidden}.pc ul{margin:0;padding:0;list-style:none}
.pc .big{font-size:26px;font-weight:700}.pc.link{padding:0}.pc.link img{width:100%;height:52%;object-fit:cover}.pc.link .lt{padding:12px;display:flex;flex-direction:column;gap:4px}
.pc.add{background:transparent;border:2px dashed #cfc3b7;box-shadow:none;align-items:center;justify-content:center;color:var(--muted);margin-left:22px}
.pc.add:first-child{margin-left:0}.pc.add:hover{border-color:var(--accent);color:var(--accent)}.pc.add span{font-size:38px;line-height:1}
.addrow{border:2px dashed var(--line);width:100%;padding:14px;color:var(--muted);background:transparent}
#modal{position:fixed;inset:0;background:#0007;display:none;align-items:center;justify-content:center;gap:12px;z-index:5;padding:12px}#modal.show{display:flex}
.sheet{background:#fff;border-radius:20px;padding:22px;width:min(460px,100%);max-height:90vh;overflow:auto;position:relative;display:flex;flex-direction:column;gap:10px}
.sheet h3{margin:0}.sheet .x{position:absolute;right:12px;top:10px;border:0;font-size:18px}.mb{display:flex;flex-direction:column;gap:8px}
.mb form{display:flex;gap:6px}.mb form input{flex:1}.mb textarea{width:100%}.big-img{max-width:100%;max-height:52vh;border-radius:14px;object-fit:contain;align-self:center}
.nav{flex:none;width:44px;height:44px;border-radius:50%;font-size:26px;padding:0;background:#fff}.check{list-style:none;margin:0;padding:0}.check li{display:flex;gap:6px;align-items:center}.check label{flex:1}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:10px}.pick button{padding:18px;font-size:16px}
.prev{display:block;color:inherit;text-decoration:none;border:1px solid var(--line);border-radius:10px;overflow:hidden}.prev img{width:100%;max-height:120px;object-fit:cover}.prev b,.prev small{display:block;padding:4px 10px}
iframe{width:100%;height:200px;border:0;border-radius:10px}
#toast{position:fixed;bottom:20px;left:50%;transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;opacity:0;transition:.2s;pointer-events:none;z-index:9;max-width:90vw}
#toast.show{opacity:1;transform:translate(-50%,0)}#toast.bad{background:var(--bad)}
.login{max-width:340px;margin:60px auto;display:flex;flex-direction:column;gap:10px}
</style></head><body>
<header><b>🍞 Crumbs <small>dev preview</small></b><nav id="nav"></nav><span id="who"></span></header>
<main id="app"></main><div id="modal"></div><div id="toast"></div>
<script>
// Throwaway viewer for the events backend. Not part of the real frontend.
const API = new URLSearchParams(location.search).get("api") ?? "http://localhost:3000";
const $ = (s) => document.querySelector(s), app = $("#app");
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const plural = (n, w) => `${n} ${w}${n === 1 ? "" : "s"}`;
const debounce = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };
const TYPES = { notes: "📝 Notes", date: "📅 Date", image: "🖼️ Image", link: "🔗 Link" };
let tab = "collections", E = null, focusId = null, chooserRow = null;

async function api(method, path, body) {
  const opt = { method, credentials: "include", headers: {} };
  if (body instanceof FormData) opt.body = body;
  else if (body) { opt.headers["Content-Type"] = "application/json"; opt.body = JSON.stringify(body); }
  const res = await fetch(API + path, opt);
  const json = await res.json().catch(() => null);
  if (!res.ok) { const e = new Error(json?.message ?? res.statusText); e.status = res.status; throw e; }
  return json;
}
function toast(msg, bad = false) {
  const t = $("#toast"); t.textContent = msg; t.className = bad ? "bad show" : "show";
  clearTimeout(toast.t); toast.t = setTimeout(() => (t.className = ""), 4000);
}
function when(s) {
  if (!s.dateStatus) return "No date";
  if (s.dateStatus === "today") return "Today";
  return s.dateStatus === "upcoming" ? `in ${plural(s.daysUntil, "day")}` : `${plural(-s.daysUntil, "day")} ago`;
}

// ---------- Collections and search ----------
function eventCard(e) {
  const s = e.summary, label = e.isOverdue ? "overdue" : e.status;
  return `<article class="card" data-id="${e.id}"><div class="thumb" style="${s.coverUrl ? `background-image:url(${esc(API + s.coverUrl)})` : ""}"></div>
    <div class="body"><span class="badge ${label}">${label}</span><h3>${esc(e.title)}</h3>
    <p class="muted">${s.eventDate ? `${esc(s.eventDate)} · ${when(s)}` : "No date yet"}</p>
    ${s.noteExcerpt ? `<small class="muted">${esc(s.noteExcerpt.slice(0, 60))}</small>` : ""}
    <div class="tags">${e.tags.map((t) => `<span>#${esc(t)}</span>`).join("")}${e.collaborators.length || e.role === "collaborator" ? `<span>👥 ${e.role === "owner" ? "shared" : "by " + esc(e.owner.username)}</span>` : ""}</div></div></article>`;
}
const grid = (events, extra = "") => `<div class="grid">${events.map(eventCard).join("")}${extra}</div>`;

async function showCollections() {
  const { events } = await api("GET", "/api/events?limit=100");
  app.innerHTML = `<h2>Collections <small class="muted">${plural(events.length, "event")} · GET /api/events</small></h2>` +
    (events.length ? "" : `<p class="empty">No events yet. Run <code>npm run seed</code> or add one below.</p>`) +
    grid(events, `<button class="card add" data-act="add"><span style="font-size:34px;color:var(--accent)">＋</span>Add event</button>`);
}

async function showSearch() {
  const opts = (l) => l.map(([v, t]) => `<option value="${v}">${t}</option>`).join("");
  app.innerHTML = `<h2>Search</h2><form id="f" class="filters"><input name="q" placeholder="Search text…">
    <select name="scope">${opts([["all", "All events"], ["mine", "Created by me"], ["shared", "Shared with me"]])}</select>
    <select name="status">${opts([["", "Any status"], ["draft", "draft"], ["planned", "planned"], ["done", "done"], ["archived", "archived"]])}</select>
    <input name="tags" placeholder="tags: school,work"><input name="dateFrom" type="date"><input name="dateTo" type="date">
    <select name="sort">${opts([["recent", "Recently edited"], ["newest", "Newest"], ["oldest", "Oldest"], ["title", "Title A-Z"], ["date_asc", "Date ↑"], ["date_desc", "Date ↓"]])}</select>
    <fieldset>${["notes", "image", "date", "link"].map((t) => `<label><input type="checkbox" name="has" value="${t}"> has ${t}</label>`).join("")}</fieldset></form>
    <p id="count" class="muted"></p><div id="res"></div>`;
  const run = async () => {
    const fd = new FormData($("#f")), p = new URLSearchParams();
    for (const k of ["q", "scope", "status", "tags", "dateFrom", "dateTo", "sort"]) if (fd.get(k)) p.set(k, fd.get(k));
    if (fd.getAll("has").length) p.set("has", fd.getAll("has").join(","));
    try {
      const { events, pagination } = await api("GET", "/api/events/search?" + p);
      $("#count").textContent = `${plural(pagination.total, "match")} · GET /api/events/search?${p}`;
      $("#res").innerHTML = events.length ? grid(events) : `<p class="empty">No events match these filters.</p>`;
    } catch (e) { toast(e.message, true); }
  };
  $("#f").addEventListener("input", debounce(run, 250)); run();
}

// ---------- Event page: rows of fanned portrait cards ----------
const tilt = (id) => (parseInt(id.slice(-4), 16) % 13) - 6; // steady -6..6 degrees per widget
const inRow = (rowId) => E.widgets.filter((w) => w.rowId === rowId);

function widgetCard(w) {
  const at = `data-act="focus" data-w="${w.id}"`, r = `--r:${tilt(w.id)}deg`;
  if (w.type === "image") return `<div class="pc fan" ${at} style="${r};${w.image ? `background-image:url(${esc(API + w.image.url)})` : ""}">${w.image ? "" : "<em>Empty image<br>click to add a picture</em>"}</div>`;
  if (w.type === "link") return `<div class="pc fan link" ${at} style="${r}">${w.preview?.image ? `<img src="${esc(w.preview.image)}" alt="">` : ""}${w.url ? `<div class="lt"><b>${esc(w.preview?.title ?? w.url)}</b><small class="muted">${esc(w.preview?.siteName ?? "")}</small></div>` : "<em>Empty link<br>click to paste one</em>"}</div>`;
  if (w.type === "date") return `<div class="pc fan" ${at} style="${r}"><b>📅 Date</b>${w.date ? `<p class="big">${esc(w.date)}</p><p class="muted">${w.label ? esc(w.label) + "<br>" : ""}${when(w)}</p>` : "<em>No date yet<br>click to pick one</em>"}</div>`;
  const items = w.checklist.slice(0, 6).map((i) => `<li>${i.done ? "☑" : "☐"} ${esc(i.text)}</li>`).join("");
  return `<div class="pc fan" ${at} style="${r}"><b>📝 Notes</b>${w.body ? `<p>${esc(w.body)}</p>` : ""}<ul>${items}</ul>${w.body || items ? "" : "<em>Empty notes<br>click to write</em>"}</div>`;
}

function renderEvent() {
  const e = E.event;
  const label = e.isOverdue ? "overdue" : e.status;
  app.innerHTML = `<button class="link" data-act="back">← Collections</button>
    <div class="head"><h2>${esc(e.title)}</h2><span class="badge ${label}">${label}</span></div><p class="muted">${esc(e.description)}</p>
    <p class="muted">By <b>${esc(e.owner.username)}</b>${e.collaborators.length ? " · shared with " + e.collaborators.map((c) => esc(c.username)).join(", ") : ""} · you are the ${e.role}</p>
    <div class="actions">Move to: ${["draft", "planned", "done", "archived"].filter((s) => s !== e.status).map((s) => `<button data-act="status" data-v="${s}">${s}</button>`).join("")}
      ${e.role === "owner" ? `<button class="danger" data-act="del">Delete event</button>` : ""}</div>
    ${e.rows.map((r) => `<section class="row"><div class="rowhead"><input class="rn" value="${esc(r.name)}" placeholder="Name this row" maxlength="40" data-act="rname" data-r="${r.id}">
      <button class="danger" data-act="delrow" data-r="${r.id}" title="Delete row">🗑</button></div>
      <div class="strip">${inRow(r.id).map(widgetCard).join("")}<div class="pc add" data-act="addw" data-r="${r.id}"><span>＋</span>Add widget</div></div></section>`).join("")}
    <button class="addrow" data-act="addrow">＋ Add a row</button>`;
  renderModal();
}

async function loadEvent(id) { E = await api("GET", "/api/events/" + id); renderEvent(); }
const reload = () => (E ? loadEvent(E.event.id) : go(tab));

// ---------- Chooser and carousel ----------
function focusBody(w) {
  const id = `data-w="${w.id}"`;
  if (w.type === "image") return `${w.image ? `<img class="big-img" src="${esc(API + w.image.url)}" alt="">` : `<p class="muted">No picture yet</p>`}
    <div><label class="btn">${w.image ? "Replace picture" : "Upload picture"}<input type="file" accept="image/*" hidden data-act="upload" ${id}></label>
    ${w.image ? `<button data-act="rmimg" ${id}>Remove picture</button>` : ""}</div>`;
  if (w.type === "date") return `<input type="date" value="${w.date ?? ""}" data-act="date" ${id}><input placeholder="Label (e.g. Departure)" value="${esc(w.label)}" data-act="label" ${id}>`;
  if (w.type === "link") return `${w.embedUrl ? `<iframe src="${esc(w.embedUrl)}" allowfullscreen></iframe>` : w.url ? `<a class="prev" href="${esc(w.url)}" target="_blank" rel="noopener">${w.preview?.image ? `<img src="${esc(w.preview.image)}" alt="">` : ""}<b>${esc(w.preview?.title ?? w.url)}</b><small class="muted">${esc(w.preview?.siteName ?? "")}${w.preview?.status === "unavailable" ? " · preview unavailable" : ""}</small></a>` : ""}
    <form data-act="link" ${id}><input name="url" placeholder="https://…" value="${esc(w.url ?? "")}"><button>Save</button></form>`;
  return `<textarea rows="6" placeholder="Write notes…" data-act="body" ${id}>${esc(w.body)}</textarea>
    <ul class="check">${w.checklist.map((i) => `<li><label><input type="checkbox" data-act="tick" ${id} data-i="${i.id}" ${i.done ? "checked" : ""}> ${esc(i.text)}</label><button data-act="delitem" ${id} data-i="${i.id}">✕</button></li>`).join("")}</ul>
    <form data-act="newitem" ${id}><input name="text" placeholder="Add a checklist item…" required><button>Add</button></form>`;
}

function renderModal() {
  const m = $("#modal");
  if (chooserRow) {
    m.className = "show";
    m.innerHTML = `<div class="sheet"><button class="x" data-act="close">✕</button><h3>Add a widget</h3><div class="pick">${Object.entries(TYPES).map(([t, l]) => `<button data-act="pick" data-t="${t}">${l}</button>`).join("")}</div></div>`;
    return;
  }
  const w = E?.widgets.find((x) => x.id === focusId);
  if (!w) { m.className = ""; m.innerHTML = ""; return; }
  const list = inRow(w.rowId), i = list.findIndex((x) => x.id === w.id);
  m.className = "show";
  m.innerHTML = `<button class="nav" data-act="step" data-d="-1" ${i === 0 ? "disabled" : ""}>‹</button>
    <div class="sheet"><button class="x" data-act="close">✕</button><h3>${TYPES[w.type]} <small class="muted">${i + 1} / ${list.length}</small></h3>
    <div class="mb">${focusBody(w)}</div><button class="danger" data-act="delw" data-w="${w.id}">Delete this widget</button></div>
    <button class="nav" data-act="step" data-d="1" ${i === list.length - 1 ? "disabled" : ""}>›</button>`;
}
const closeModal = () => { focusId = null; chooserRow = null; renderModal(); };

// ---------- Actions ----------
async function handle(el) {
  const d = el.dataset, w = () => E.widgets.find((x) => x.id === d.w), patch = (body) => api("PATCH", "/api/widgets/" + d.w, body);
  const acts = {
    tab: () => go(d.v),
    back: () => { E = null; return go("collections"); },
    add: async () => { const t = prompt("Event title?"); if (!t) return; const r = await api("POST", "/api/events", { title: t }); toast("Created: one empty row"); await loadEvent(r.event.id); },
    status: async () => { await api("PATCH", `/api/events/${E.event.id}/status`, { status: d.v }); toast(`Status is now ${d.v}`); await reload(); },
    del: async () => { if (!confirm("Delete this event for everyone?")) return; const r = await api("DELETE", "/api/events/" + E.event.id); toast(`Deleted: ${plural(r.deleted.widgets, "widget")}, ${plural(r.deleted.images, "picture")}`); E = null; await go("collections"); },
    addrow: async () => { await api("POST", `/api/events/${E.event.id}/rows`, {}); await reload(); },
    rname: async () => { await api("PATCH", `/api/events/${E.event.id}/rows/${d.r}`, { name: el.value }); toast("Row renamed"); await reload(); },
    delrow: async () => { if (!confirm("Delete this row and everything in it?")) return; const r = await api("DELETE", `/api/events/${E.event.id}/rows/${d.r}`); toast(`Row deleted (${plural(r.deleted.widgets, "widget")})`); await reload(); },
    addw: () => { chooserRow = d.r; renderModal(); },
    pick: async () => { const r = await api("POST", `/api/events/${E.event.id}/rows/${chooserRow}/widgets`, { type: d.t }); chooserRow = null; focusId = r.widget.id; await reload(); },
    focus: () => { focusId = d.w; renderModal(); },
    close: closeModal,
    step: () => { const l = inRow(w0().rowId), i = l.findIndex((x) => x.id === focusId); focusId = l[i + Number(d.d)].id; renderModal(); },
    delw: async () => { if (!confirm("Delete this widget?")) return; await api("DELETE", "/api/widgets/" + d.w); focusId = null; toast("Widget deleted"); await reload(); },
    tick: async () => { await api("PATCH", `/api/widgets/${d.w}/checklist/${d.i}`, { done: el.checked }); await reload(); },
    delitem: async () => { await patch({ checklist: w().checklist.filter((i) => i.id !== d.i) }); await reload(); },
    newitem: async () => { await patch({ checklist: [...w().checklist, { text: el.text.value }] }); await reload(); },
    body: async () => { await patch({ body: el.value }); toast("Notes saved"); await reload(); },
    date: async () => { await patch({ date: el.value || null }); toast("Date saved"); await reload(); },
    label: async () => { await patch({ label: el.value }); toast("Label saved"); await reload(); },
    link: async () => { await patch({ url: el.url.value }); toast("Link saved"); await reload(); },
    upload: async () => { const fd = new FormData(); fd.append("image", el.files[0]); await api("POST", `/api/widgets/${d.w}/image`, fd); toast("Picture saved"); await reload(); },
    rmimg: async () => { await api("DELETE", `/api/widgets/${d.w}/image`); await reload(); },
  };
  try { await acts[d.act](); } catch (e) { toast(`${e.status ?? ""} ${e.message}`.trim(), true); }
}
const w0 = () => E.widgets.find((x) => x.id === focusId);
const FIELD_ACTS = ["tick", "date", "label", "body", "upload", "rname", "link", "newitem"];

document.addEventListener("click", (ev) => {
  if (ev.target.id === "modal") return closeModal();
  const el = ev.target.closest("[data-act]");
  if (el && !FIELD_ACTS.includes(el.dataset.act)) return handle(el);
  const c = ev.target.closest(".card[data-id]");
  if (c) loadEvent(c.dataset.id).catch((e) => toast(e.message, true));
});
document.addEventListener("change", (ev) => { const el = ev.target.closest("[data-act]"); if (el && el.matches("input,textarea") && FIELD_ACTS.includes(el.dataset.act)) handle(el); });
document.addEventListener("submit", (ev) => { const el = ev.target.closest("[data-act]"); if (el) { ev.preventDefault(); handle(el); } });
document.addEventListener("keydown", (ev) => {
  if (!$("#modal").classList.contains("show")) return;
  if (ev.key === "Escape") return closeModal();
  if (ev.target.matches("input,textarea") || !focusId) return;
  const b = $(`[data-act=step][data-d="${ev.key === "ArrowRight" ? 1 : ev.key === "ArrowLeft" ? -1 : 0}"]`);
  if (b && !b.disabled) b.click();
});

const views = { collections: showCollections, search: showSearch };
function go(t) {
  tab = t;
  $("#nav").innerHTML = Object.keys(views).map((k) => `<button data-act="tab" data-v="${k}" class="${k === t ? "on" : ""}">${k}</button>`).join("");
  return views[t]().catch((e) => toast(e.message, true));
}
function loginForm(msg = "") {
  $("#nav").innerHTML = ""; $("#who").textContent = "";
  app.innerHTML = `<form class="login" id="login"><h2>Sign in</h2><p class="muted">${esc(msg)}</p>
    <input name="email" type="email" value="demo@crumbs.test" required><input name="password" type="password" value="Password123!" required>
    <button>Sign in</button><small class="muted">After <code>npm run seed</code> the demo account has sample events.</small></form>`;
  $("#login").addEventListener("submit", async (ev) => {
    ev.preventDefault();
    try { await api("POST", "/api/auth/login", { email: ev.target.email.value, password: ev.target.password.value }); boot(); } catch (e) { loginForm(e.message); }
  });
}
